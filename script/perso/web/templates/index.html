<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MatheoFM - Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Petit ajout rapide pour le spinner de chargement */
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #1DB954;
            font-family: sans-serif;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #1DB954;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <span>Récupération des données...</span>
    </div>

    <nav>
        <div class="nav-links">
            <button onclick="showSection('artists')">Artistes</button>
            <button onclick="showSection('albums')">Albums</button>
            <button onclick="showSection('tracks')">Titres</button>
            <button onclick="showSection('scrobbles')">📜 Historique</button>
            <button id="nav-stats-btn" onclick="showSection('stats')" style="background: #1DB954; color: white;">📊 Stats</button>
        </div>
        <div id="total-count" class="counter"></div>
    </nav>

    <div class="filter-bar">
        <div class="filter-group">
            <input type="date" id="startDate" title="Date de début">
            <input type="date" id="endDate" title="Date de fin">
        </div>
        <div class="filter-group">
            <input type="text" id="artistInput" placeholder="Rechercher un artiste...">
            <input type="text" id="albumInput" placeholder="Rechercher un album...">
        </div>
        <div class="filter-actions">
            <button onclick="applyManualFilters()" style="background: #1DB954; color: white; font-weight: bold;">Appliquer</button>
            <button onclick="clearAllFilters()" style="background: rgba(255,255,255,0.1);">Reset</button>
        </div>
    </div>

    <div id="now-playing-container" style="display: none;"></div>

    <main id="main-content">
        <div id="content-list"></div>
        
        {% include 'stats.html' %}
    </main>

    <div id="pagination" class="pagination-container"></div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="{{ url_for('static', filename='charts.js') }}"></script>
    <script src="{{ url_for('static', filename='section.js') }}"></script>

    <script>
        // Petite logique pour fermer le loading overlay quand une section est chargée
        function toggleLoading(show) {
            document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
        }

        // On peut écouter les changements de section pour mettre à jour l'UI du menu
        function updateNavActive(section) {
            const btns = document.querySelectorAll('.nav-links button');
            btns.forEach(btn => btn.style.background = 'transparent');
            
            // On remet le vert sur le bouton actif
            const activeBtn = Array.from(btns).find(b => b.innerText.toLowerCase().includes(section.substring(0,3)));
            if(activeBtn) activeBtn.style.background = '#1DB954';
        }
    </script>
</body>
</html>
